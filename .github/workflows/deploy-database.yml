name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guilded-production-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify database secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL as a GitHub Actions repository secret before deploying migrations."
            exit 1
          fi

      - name: Apply pending Prisma migrations
        run: pnpm db:deploy
